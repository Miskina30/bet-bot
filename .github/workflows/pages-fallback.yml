# Add this to .github/workflows/pages.yml as a fallback if "Configure Pages" keeps failing.
# It pushes the site/ directory to a gh-pages branch, which serves it directly.

  deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
