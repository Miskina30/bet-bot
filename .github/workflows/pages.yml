name: Deploy Pages preview

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pages not enabled notice
        if: failure()
        run: |
          echo "::error title=GitHub Pages not enabled::"
          echo "Enable it in Settings → Pages → Source: 'GitHub Actions'"
          echo "The site/ directory will deploy on the next push."
          echo "Site URL will be: https://miskina30.github.io/bet-bot/"
          exit 0


