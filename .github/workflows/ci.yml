name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACADEMIC_EDGE_ENV: test
  DATABASE_URL: "sqlite+pysqlite:///:memory:"
  RAW_ARCHIVE_BACKEND: filesystem
  RAW_ARCHIVE_DIR: ./.data/ci-raw
  CROCOBET_WEB_ENABLED: "false"

jobs:
  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy (strict on packages + api + worker)
        run: mypy

  test:
    name: Tests (SQLite profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Policy gate self-test (Crocobet web must stay disabled)
        run: |
          python -c "import sys; sys.path.insert(0,'packages/domain'); from academic_edge_domain.policy import load_registry; r=load_registry(); assert r.get('crocobet').automation_allowed is False, 'Crocobet automation must be disabled'"
      - name: Migrations apply and roll back
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest
        run: pytest -q --durations=10

  test-postgres:
    name: Tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academic_edge
          POSTGRES_PASSWORD: academic_edge
          POSTGRES_DB: academic_edge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U academic_edge" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://academic_edge:academic_edge@localhost:5432/academic_edge
      ACADEMIC_EDGE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migrations
        run: |
          alembic upgrade head
      - name: Pytest (Postgres profile)
        run: pytest -q

  seeds-smoke:
    name: Keyless demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Seed the labelled fixture dataset and boot the API
        run: |
          alembic upgrade head
          python -m academic_edge_worker.cli seed
          python -m academic_edge_worker.cli opportunities --json | head -c 2000
          python - <<'PY'
          from fastapi.testclient import TestClient
          from academic_edge_api.main import create_app
          client = TestClient(create_app())
          for path in ("/v1/health", "/v1/sources/health", "/v1/events",
                       "/v1/opportunities", "/v1/alerts", "/v1/paper-ledger"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code, response.text[:200])
              print(path, "ok")
          PY

  no-secrets:
    name: Secret + safety guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if a .env or credential-looking file was committed
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' ; then
            echo "::error::A .env file is committed. Secrets must never be committed."; exit 1
          fi
          if git grep -nEI '(api[_-]?key|token|secret|password)[[:space:]]*[:=][[:space:]]*["'\''][A-Za-z0-9_\-]{16,}' -- . ':!*.example' ':!*.md' ; then
            echo "::error::Possible committed credential detected."; exit 1
          fi
          echo "No committed secrets detected."
      - name: Fail if wagering/wallet code appears anywhere
        run: |
          set -euo pipefail
          if git grep -nEI '(place_bet|place_order|submit_order|sign_transaction|withdraw_funds|wallet_private_key)' -- . ':!*.md' ':!docs/*' ; then
            echo "::error::Academic Edge is read-only: no wagering or wallet code is allowed."; exit 1
          fi
          echo "Read-only guard passed."